<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Number Rush</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #18251f; color: #f7fff9; }
      main { width: min(92vw, 520px); text-align: center; }
      .hud { display: flex; justify-content: space-between; margin-bottom: 18px; color: #b4d4c0; }
      button { border: 0; border-radius: 14px; padding: 15px; font: inherit; font-size: 1.2rem; font-weight: 800; cursor: pointer; background: #9be15d; color: #18251f; }
      #start { border-radius: 999px; padding: 12px 22px; font-size: 1rem; }
      #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 28px auto; max-width: 330px; }
      #message { min-height: 1.5em; color: #b4d4c0; }
    </style>
  </head>
  <body>
    <main>
      <div class="hud"><span>Next: <strong id="next">1</strong></span><span>Best: <strong id="best">—</strong></span></div>
      <button id="start" type="button">Start puzzle</button>
      <div id="board" aria-label="Number board"></div>
      <p id="message">Click numbers from 1 to 9 in order.</p>
    </main>
    <script>
      const start = document.querySelector("#start");
      const board = document.querySelector("#board");
      const next = document.querySelector("#next");
      const best = document.querySelector("#best");
      const message = document.querySelector("#message");
      let expected = 1;
      let startedAt = 0;
      let bestTime = null;
      function shuffle(numbers) {
        return numbers.sort(() => Math.random() - 0.5);
      }
      function startGame() {
        expected = 1;
        startedAt = performance.now();
        next.textContent = expected;
        message.textContent = "Find the numbers in order.";
        board.replaceChildren();
        shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9]).forEach((number) => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = number;
          button.addEventListener("click", () => {
            if (number !== expected) {
              message.textContent = `Look for ${expected} next.`;
              return;
            }
            button.disabled = true;
            expected += 1;
            next.textContent = expected > 9 ? "done" : expected;
            if (expected > 9) {
              const elapsed = ((performance.now() - startedAt) / 1000).toFixed(2);
              bestTime = bestTime === null ? elapsed : Math.min(bestTime, elapsed);
              best.textContent = `${bestTime}s`;
              message.textContent = `Board cleared in ${elapsed}s.`;
            }
          });
          board.append(button);
        });
      }
      start.addEventListener("click", startGame);
    </script>
  </body>
</html>
