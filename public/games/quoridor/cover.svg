<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Quoridor</title>
  <desc id="desc">A strategic board game cover with pawns and walls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d3b"/>
      <stop offset="1" stop-color="#54203f"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30365f"/>
      <stop offset="1" stop-color="#151827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1040" cy="80" r="170" fill="#6366f1" opacity=".22"/>
  <circle cx="160" cy="560" r="220" fill="#f43f5e" opacity=".16"/>
  <g transform="translate(705 88) rotate(8)">
    <rect width="360" height="360" rx="28" fill="url(#board)" stroke="#8990c8" stroke-width="6"/>
    <g stroke="#7279ae" stroke-width="3" opacity=".72">
      <path d="M45 0v360M90 0v360M135 0v360M180 0v360M225 0v360M270 0v360M315 0v360"/>
