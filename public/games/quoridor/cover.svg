      <circle cx="90" cy="315" r="18"/>
    </g>
    <g fill="#6366f1">
      <rect x="90" y="135" width="92" height="18" rx="9"/>
      <rect x="225" y="225" width="92" height="18" rx="9" transform="rotate(90 271 234)"/>
    </g>
  </g>
  <text x="82" y="245" fill="#e7e9ee" font-family="Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="8">QUORIDOR</text>
  <text x="88" y="315" fill="#c6cae7" font-family="Arial, sans-serif" font-size="28" letter-spacing="3">STRATEGY · BLOCK · REACH THE OTHER SIDE</text>
  <rect x="88" y="380" width="210" height="8" rx="4" fill="#f43f5e"/>
