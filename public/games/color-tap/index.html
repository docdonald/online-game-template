<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Color Tap</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171827; color: #f7f7fb; }
      main { width: min(92vw, 520px); text-align: center; }
      .hud { display: flex; justify-content: space-between; margin-bottom: 18px; color: #aeb3d1; }
      button { border: 0; border-radius: 999px; padding: 12px 22px; font: inherit; font-weight: 700; cursor: pointer; }
      #start { background: #ffcb55; color: #171827; }
      #target { width: 96px; height: 96px; margin: 36px auto; border-radius: 50%; background: #ff6b7a; cursor: pointer; box-shadow: 0 0 0 14px #ff6b7a22; }
      #target:disabled { visibility: hidden; }
      #message { min-height: 1.5em; color: #aeb3d1; }
    </style>
  </head>
  <body>
    <main>
      <div class="hud"><span>Score: <strong id="score">0</strong></span><span>Time: <strong id="time">30</strong>s</span></div>
      <button id="start" type="button">Start round</button>
      <button id="target" type="button" disabled aria-label="Target"></button>
      <p id="message">Tap the target as many times as you can.</p>
    </main>
    <script>
      const start = document.querySelector("#start");
      const target = document.querySelector("#target");
      const score = document.querySelector("#score");
      const time = document.querySelector("#time");
      const message = document.querySelector("#message");
      let points = 0;
      let remaining = 30;
      let timer;
      function moveTarget() {
        const hue = Math.floor(Math.random() * 360);
        target.style.background = `hsl(${hue} 85% 68%)`;
        target.style.boxShadow = `0 0 0 14px hsl(${hue} 85% 68% / 0.14)`;
      }
      function finish() {
        clearInterval(timer);
        target.disabled = true;
        start.disabled = false;
        message.textContent = `Round over. You scored ${points} taps.`;
      }
      start.addEventListener("click", () => {
        points = 0;
        remaining = 30;
        score.textContent = points;
        time.textContent = remaining;
        target.disabled = false;
        start.disabled = true;
        message.textContent = "Keep tapping!";
        moveTarget();
        clearInterval(timer);
        timer = setInterval(() => {
          remaining -= 1;
          time.textContent = remaining;
          if (remaining === 0) finish();
        }, 1000);
      });
      target.addEventListener("click", () => {
        if (target.disabled) return;
        points += 1;
        score.textContent = points;
        moveTarget();
      });
    </script>
  </body>
</html>
